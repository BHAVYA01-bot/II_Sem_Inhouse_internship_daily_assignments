<!DOCTYPE html>
<html>

<head>

<title>Registration Form</title>

<link rel="stylesheet" href="registrationform.css">

</head>

<body>

<div class="container">

<h2>Register</h2>

<form action="registration.php" method="POST">

<label>Full Name</label>

<input type="text"
name="fullname"
required>

<label>Email</label>

<input type="email"
name="email"
required>

<label>Phone Number</label>

<input type="text"
name="phone"
required>

<label>Password</label>

<input
type="password"
name="password"
required>

<label>Confirm Password</label>

<input
type="password"
name="confirmPassword"
required>

<input
type="submit"
value="Register">

</form>

</div>

</body>

</html>
