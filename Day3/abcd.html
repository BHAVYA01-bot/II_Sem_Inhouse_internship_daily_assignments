<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Demo</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <h1>🌟 CSS Flexbox Example 🌟</h1>

    <div class="container">

        <div class="box">
            <h2>Box 1</h2>
            <p>HTML</p>
        </div>

        <div class="box">
            <h2>Box 2</h2>
            <p>CSS</p>
        </div>

        <div class="box">
            <h2>Box 3</h2>
            <p>JavaScript</p>
        </div>

        <div class="box">
            <h2>Box 4</h2>
            <p>Bootstrap</p>
        </div>

        <div class="box">
            <h2>Box 5</h2>
            <p>Python</p>
        </div>

        <div class="box">
            <h2>Box 6</h2>
            <p>Java</p>
        </div>

    </div>

</body>

</html>
