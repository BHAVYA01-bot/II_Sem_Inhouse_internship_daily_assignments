<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Grid Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin:30px 0;
            font-weight:bold;
        }

        .card{
            border:none;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
        }

        .card img{
            height:250px;
            object-fit:cover;
        }

        .btn{
            width:100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>I AM HERE</h1>

    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="images/pic1.jpg" class="card-img-top" alt="Image">

                <div class="card-body">
                    <h4 class="card-title">Welcome</h4>

                    <p class="card-text">
                        This is a simple Bootstrap card.
                    </p>

                    <button class="btn btn-primary">
                        Learn More
                    </button>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4">
            <div class="card">
                <img src="images/paper.gif" class="card-img-top" alt="Paper">

                <div class="card-body">
                    <h4 class="card-title">Paper GIF</h4>

                    <p class="card-text">
                        Bootstrap makes responsive websites very easy.
                    </p>

                    <button class="btn btn-success">
                        View
                    </button>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4">
            <div class="card">
                <img src="images/pic2.jpg" class="card-img-top" alt="Image">

                <div class="card-body">
                    <h4 class="card-title">Bootstrap</h4>

                    <p class="card-text">
                        Practice cards, grids and buttons to improve your skills.
                    </p>

                    <button class="btn btn-danger">
                        Explore
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
