<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
</head>
<body>

    <h2>Simple Calculator</h2>

    <input type="number" id="number1" placeholder="Enter First Number">

    <input type="number" id="number2" placeholder="Enter Second Number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button type="button" onclick="PerformArithmeticOperations()">
        Calculate
    </button>

    <h3 id="result">Result: </h3>

    <script>

        function PerformArithmeticOperations() {

            let number1 = parseFloat(document.getElementById("number1").value);
            let number2 = parseFloat(document.getElementById("number2").value);
            let operator = document.getElementById("operator").value;

            let result;

            if (operator == "+") {
                result = number1 + number2;
            }
            else if (operator == "-") {
                result = number1 - number2;
            }
            else if (operator == "*") {
                result = number1 * number2;
            }
            else if (operator == "/") {
                result = number1 / number2;
            }

            document.getElementById("result").innerHTML =
                "Result: " + result;
        }

    </script>

</body>
</html>
