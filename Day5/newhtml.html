<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        .box{
            width: 350px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border: 1px solid gray;
            border-radius: 10px;
        }

        button{
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkblue;
        }

        #message{
            margin-top: 20px;
            color: green;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Welcome</h1>

    <p>This is my first HTML, CSS and JavaScript page.</p>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="message"></p>

</div>

<script>

function showMessage()
{
    document.getElementById("message").innerHTML =
    "Hello Bhavya! Welcome to JavaScript.";
}

</script>

</body>
</html>
