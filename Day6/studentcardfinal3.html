<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">Student Records</h2>

    <input type="text" id="search" class="form-control mb-4"
    placeholder="Search Student">

    <div class="row" id="container"></div>

    <h4 class="mt-5">JSON Data (CGPA Hidden)</h4>
    <pre id="json"></pre>

</div>

<script>

const students = [

{

image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT325_Lf7UAR9mlrgPvM-1kjxxFR3-kmLvQTOFSxIgS4Q&s=10"
},

{
name:"ARNAV",
branch:"AI",
cgpa:"8.4",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT325_Lf7UAR9mlrgPvM-1kjxxFR3-kmLvQTOFSxIgS4Q&s=10"
},

{
name:"ARPAN",
branch:"AI",
cgpa:"8.5",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT325_Lf7UAR9mlrgPvM-1kjxxFR3-kmLvQTOFSxIgS4Q&s=10"
},

{
name:"CHARU",
branch:"AI",
cgpa:"9.3",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7N8kGIg_JQPag9Divoh0ZljTfWYoY3AChzjd1ePfpMg&s=10"
},

{
name:"BHOOMI",
branch:"AI",
cgpa:"9.4",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7N8kGIg_JQPag9Divoh0ZljTfWYoY3AChzjd1ePfpMg&s=10"
},

{
name:"AYUSH",
branch:"AI",
cgpa:"9.4",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT325_Lf7UAR9mlrgPvM-1kjxxFR3-kmLvQTOFSxIgS4Q&s=10"
},

{
name:"AAROHI",
branch:"AI",
cgpa:"9.7",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7N8kGIg_JQPag9Divoh0ZljTfWYoY3AChzjd1ePfpMg&s=10"
},

{
name:"BHAVIK",
branch:"AI",
cgpa:"8.8",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT325_Lf7UAR9mlrgPvM-1kjxxFR3-kmLvQTOFSxIgS4Q&s=10"
},

{
name:"ANKITA",
branch:"AI",
cgpa:"8.9",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7N8kGIg_JQPag9Divoh0ZljTfWYoY3AChzjd1ePfpMg&s=10"
},

{
name:"BHARTI",
branch:"AI",
cgpa:"8.1",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7N8kGIg_JQPag9Divoh0ZljTfWYoY3AChzjd1ePfpMg&s=10"
}

];

let html="";

for(let i=0;i<students.length;i++){

html += `

<div class="col-md-4 mb-4 card-item">

<div class="card shadow">

<div class="card-body text-center">

<img src="${students[i].image}"
width="120"
height="120"
class="rounded-circle mb-3">

<h4>${students[i].name}</h4>

<button class="btn btn-primary btn-sm"
onclick="toggleDetails(this)">
Show Details
</button>

<div class="details mt-3" style="display:none">

<p><strong>Branch:</strong> ${students[i].branch}</p>

<p><strong>CGPA:</strong> ${students[i].cgpa}</p>

</div>

</div>

</div>

</div>

`;

}

document.getElementById("container").innerHTML=html;

function toggleDetails(button){

let details=button.nextElementSibling;

if(details.style.display=="none"){

details.style.display="block";
button.innerHTML="Hide Details";

}
else{

details.style.display="none";
button.innerHTML="Show Details";

}

}

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let cards=document.getElementsByClassName("card-item");

for(let i=0;i<cards.length;i++){

let name=students[i].name.toLowerCase();

if(name.includes(value))
cards[i].style.display="block";
else
cards[i].style.display="none";

}

});

function replace(key,value){

if(key=="cgpa")
return undefined;

return value;

}

document.getElementById("json").innerHTML=
JSON.stringify(students,replace,4);

</script>

</body>
</html>
