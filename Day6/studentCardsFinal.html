<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="text-center mb-4">Student Records</h2>

    <div id="container" class="row g-3"></div>

</div>

<script>

const students = [

{name:"BHAVYA", branch:"AI", cgpa:"8.5"},
{name:"ARNAV", branch:"AI", cgpa:"8.4"},
{name:"ARPAN", branch:"AI", cgpa:"8.5"},
{name:"CHARU", branch:"AI", cgpa:"9.3"},
{name:"BHOOMI", branch:"AI", cgpa:"9.4"},
{name:"AYUSH", branch:"AI", cgpa:"9.4"},
{name:"AAROHI", branch:"AI", cgpa:"9.7"},
{name:"BHAVIK", branch:"AI", cgpa:"8.8"},
{name:"ANKITA", branch:"AI", cgpa:"8.9"},
{name:"BHARTI", branch:"AI", cgpa:"8.1"}

];

let html = "";

for(let i = 0; i < students.length; i++)
{

html += `

<div class="col-md-4">

<div class="card shadow">

<div class="card-body">

<h4>${students[i].name}</h4>

<p><strong>Branch:</strong> ${students[i].branch}</p>

<p><strong>CGPA:</strong> ${students[i].cgpa}</p>

</div>

</div>

</div>

`;

}

document.getElementById("container").innerHTML = html;

</script>

</body>
</html>
